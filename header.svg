<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 170" width="840" height="170" role="img" aria-label="Jai Agrawal. Software Development Engineer, Full Stack, AI Systems.">
  <defs>
    <linearGradient id="grad" gradientUnits="userSpaceOnUse" x1="43" y1="0" x2="797" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <clipPath id="line">
      <rect x="43" y="124" width="754" height="4" rx="2"/>
    </clipPath>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .cur { fill: #58a6ff; animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .shine { animation: shine 3.2s ease-in-out infinite; }
      @keyframes shine { 0% { transform: translateX(0); } 70%, 100% { transform: translateX(980px); } }
      .dot { animation: dot 1.8s ease-in-out infinite; }
      @keyframes dot { 0%, 100% { opacity: .25; } 40% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .cur, .shine, .dot { animation: none; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="838" height="168" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <text x="43" y="70" font-size="34" font-weight="700" fill="#e6edf3">Jai Agrawal<tspan class="cur">_</tspan></text>
  <text x="43" y="100" font-size="14" fill="#8b949e">Software Development Engineer · Full Stack · AI Systems</text>

  <circle class="dot" cx="757" cy="58" r="5" fill="#58a6ff"/>
  <circle class="dot" cx="775" cy="58" r="5" fill="#a371f7" style="animation-delay:.3s"/>
  <circle class="dot" cx="793" cy="58" r="5" fill="#3fb950" style="animation-delay:.6s"/>

  <g clip-path="url(#line)">
    <rect x="43" y="124" width="754" height="4" fill="url(#grad)"/>
    <rect class="shine" x="-100" y="124" width="100" height="4" fill="#ffffff" opacity=".75"/>
  </g>
</svg>
